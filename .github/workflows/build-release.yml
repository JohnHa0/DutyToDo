name: Build and Release DEB (AMD64 & ARM64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python Base Dependencies
        run: |
          pip install fastapi "uvicorn[standard]" sqlalchemy pydantic pyinstaller

      - name: Install llama-cpp-python (pre-built wheel, no compilation)
        run: |
          pip install llama-cpp-python \
            --prefer-binary \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          
      - name: Build Backend (PyInstaller)
        run: |
          cd backend
          pyinstaller \
            --name backend_server \
            --onedir \
            --collect-all uvicorn \
            --collect-all fastapi \
            --collect-all pydantic \
            --collect-all llama_cpp \
            --copy-metadata fastapi \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import uvicorn.lifespan.off \
            main.py
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install
          
      - name: Build Frontend and DEB (Electron Builder)
        env:
          DEBUG: electron-builder
        run: |
          cd frontend
          npm run build
          npx electron-builder --linux deb --publish never
          
      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DutyToDo-Linux-DEB-${{ matrix.os }}
          path: frontend/dist-electron/*.deb
          
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: frontend/dist-electron/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
