name: Build and Release (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux DEB (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # Run inside an ubuntu-20.04 container to ensure compatibility with older GLIBC (2.31)
    container:
      image: ubuntu:20.04
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Install system basics (curl, git)
        run: |
          apt-get update
          apt-get install -y curl git sudo
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install System Dependencies (Linux)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository -y universe
          apt-get update
          apt-get install -y build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev cmake clang libclang-dev
          apt-get install -y libwebkit2gtk-4.0-dev || apt-get install -y libwebkit2gtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          rm -f package-lock.json
          npm config set registry https://registry.npmjs.org/
          npm install
          
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: 'DutyToDo ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          rm -f package-lock.json
          npm config set registry https://registry.npmjs.org/
          npm install

      - name: Build Tauri App (Universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: 'DutyToDo ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
