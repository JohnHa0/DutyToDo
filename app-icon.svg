<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop Shadow for the whole object -->
    <filter id="main-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="32" stdDeviation="40" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    
    <!-- Paper Gradients -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f2f5" />
    </linearGradient>
    
    <!-- Clipboard/Backboard Gradient -->
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34495e" />
      <stop offset="100%" stop-color="#2c3e50" />
    </linearGradient>

    <!-- Metal Clip Gradients -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f6fa" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#dcdde1" />
      <stop offset="100%" stop-color="#7f8fa6" />
    </linearGradient>
    
    <!-- Notification Badge Gradient -->
    <radialGradient id="badge-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff7675" />
      <stop offset="100%" stop-color="#d63031" />
    </radialGradient>
    
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55efc4" />
      <stop offset="100%" stop-color="#00b894" />
    </linearGradient>
  </defs>

  <g filter="url(#main-shadow)">
    <!-- Backboard -->
    <rect x="224" y="128" width="576" height="768" rx="48" fill="url(#board-grad)" stroke="#222f3e" stroke-width="4" />
    
    <!-- Paper Stack -->
    <rect x="256" y="208" width="512" height="656" rx="24" fill="#bdc3c7" />
    <rect x="272" y="224" width="512" height="656" rx="24" fill="url(#paper-grad)" stroke="#ecf0f1" stroke-width="2" />
    
    <!-- Metal Clip Base (3D) -->
    <rect x="384" y="80" width="256" height="96" rx="32" fill="url(#metal-grad)" filter="drop-shadow(0px 16px 16px rgba(0,0,0,0.5))" />
    <rect x="400" y="88" width="224" height="80" rx="24" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.8" />
    <circle cx="512" cy="112" r="16" fill="#2d3436" filter="drop-shadow(0px -2px 2px rgba(255,255,255,0.8))" />
    <circle cx="512" cy="112" r="12" fill="#1e272e" />
    
    <!-- Checkmark 3D element -->
    <circle cx="528" cy="512" r="144" fill="url(#green-grad)" filter="drop-shadow(0 16px 24px rgba(0,184,148,0.4))" />
    <!-- Highlight on circle -->
    <circle cx="528" cy="512" r="136" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="6" />
    
    <!-- Checkmark Path -->
    <path d="M 456 512 L 504 568 L 608 448" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 8px 8px rgba(0,130,100,0.6))" />
    
    <!-- Lines of text on paper -->
    <rect x="336" y="720" width="384" height="20" rx="10" fill="#dfe6e9" />
    <rect x="336" y="776" width="256" height="20" rx="10" fill="#dfe6e9" />
    <rect x="336" y="288" width="160" height="20" rx="10" fill="#dfe6e9" />

    <!-- Notification Badge 3D -->
    <circle cx="768" cy="224" r="88" fill="url(#badge-grad)" filter="drop-shadow(0 16px 24px rgba(214,48,49,0.5))" />
    <circle cx="768" cy="224" r="80" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="6" />
    <text x="768" y="260" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="100" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 4px 6px rgba(150,0,0,0.6))">3</text>
  </g>
</svg>
